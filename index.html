<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7Anime - Classroom of the Elite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="container nav-container">
            <button class="mobile-menu-btn" aria-label="Menu">☰</button>
            <a href="#" class="brand-logo" onclick="showHomePage()">
                <span class="badge-7">7</span>Anime
            </a>
            <nav class="desktop-nav">
                <a href="#" class="nav-link active" onclick="showHomePage()">Home</a>
                <a href="#" class="nav-link">Explore</a>
                <a href="#" class="nav-link">Genres</a>
            </nav>
            <div class="search-box-wrapper desktop-search-wrapper">
                <div class="search-box">
                    <input type="text" class="searchInput" placeholder="Search..." autocomplete="off">
                </div>
                <div class="search-dropdown searchDropdown"></div>
            </div>
            <div class="nav-actions">
                <button class="icon-btn">🔔</button>
                <div class="profile-avatar">U</div>
            </div>
        </div>
    </header>

    <!-- HOME VIEW SECTION -->
    <div id="homeView">
        <main class="container">
            <div class="mobile-search-bar">
                <div class="search-box-wrapper">
                    <div class="search-box">
                        <input type="text" class="searchInput" placeholder="Search..." autocomplete="off">
                    </div>
                    <div class="search-dropdown searchDropdown"></div>
                </div>
            </div>

            <div class="category-pills">
                <button class="cat-pill active">Anime</button>
                <button class="cat-pill hentai" onclick="openAgeGate()">Hentai</button>
                <button class="cat-pill">Movies</button>
            </div>

            <!-- TRENDING SECTION -->
            <section>
                <div class="section-title">
                    <h2>Trending This Week</h2>
                    <a href="#" class="view-all">View All →</a>
                </div>
                <div class="anime-grid" id="trendingGrid"></div>
            </section>

            <!-- HERO BANNER -->
            <section class="hero-section" id="heroBanner">
                <div class="hero-content">
                    <span class="hero-badge" id="heroBadge">#1 Trending</span>
                    <h1 class="hero-title">Classroom of the Elite</h1>
                    <div class="hero-meta">TV Series • 43 Episodes • Hindi Dub</div>
                    <p class="hero-desc">Watch Season 1 to 4 completely in Hindi Dubbed!</p>
                    <div class="hero-btns">
                        <button class="btn-primary" onclick="playAnime('1', 's1', 'ep1')">Watch Now</button>
                        <button class="btn-secondary" id="watchlistBtn" onclick="toggleHeroWatchlist()">+ Add to Watchlist</button>
                    </div>
                </div>
            </section>

            <section>
                <div class="section-title">
                    <h2>Continue Watching</h2>
                </div>
                <div class="continue-grid" id="continueGrid"></div>
            </section>

            <section>
                <div class="section-title">
                    <h2>Popular Genres</h2>
                </div>
                <div class="genres-grid" id="genresGrid"></div>
            </section>
        </main>
    </div>

    <!-- PLAYER VIEW SECTION (DYNAMICALLY POPULATED) -->
    <div id="playerView" class="hidden">
        <main class="container" style="padding-top: 20px;">
            <button class="btn-secondary" onclick="showHomePage()" style="margin-bottom: 15px;">← Back to Home</button>
            <div id="playerContainer"></div>
        </main>
    </div>

    <!-- MOBILE BOTTOM NAV -->
    <nav class="mobile-bottom-nav">
        <a href="#" class="bottom-nav-item active" onclick="showHomePage()">
            <span class="bottom-nav-icon">🏠</span>
            <span>Home</span>
        </a>
    </nav>

    <!-- AGE GATE MODAL -->
    <div class="modal-overlay" id="ageGateModal">
        <div class="modal-card">
            <h3>18+ Age Verification</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">Confirm you are 18+ to proceed.</p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn-primary" onclick="confirmAge(true)">I am 18+</button>
                <button class="btn-secondary" onclick="confirmAge(false)">Cancel</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
