<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>7Anime — Anime Streaming UI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#090a0f;
  --card:#11131b;
  --card2:#171923;
  --text:#f5f5f7;
  --muted:#9296a5;
  --accent:#7c5cff;
  --accent2:#9b82ff;
  --border:#242633;
  --danger:#ff5263;
  --success:#48d597;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================
   LOADING / SHIMMER
========================= */

#loader{
  position:fixed;
  inset:0;
  z-index:9999;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.4s;
}

.loader-box{
  width:min(90%,500px);
}

.loader-logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  margin-bottom:30px;
}

.loader-logo span{
  color:var(--accent);
}

.shimmer{
  position:relative;
  overflow:hidden;
  background:#151720;
  border-radius:8px;
}

.shimmer::after{
  content:"";
  position:absolute;
  inset:0;
  transform:translateX(-100%);
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.08),
    transparent
  );
  animation:shimmer 1.2s infinite;
}

@keyframes shimmer{
  100%{
    transform:translateX(100%);
  }
}

.loader-line{
  height:14px;
  margin:12px 0;
}

.loader-line.big{
  height:35px;
  width:65%;
  margin:auto;
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(9,10,15,.92);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}

.navbar{
  max-width:1400px;
  margin:auto;
  min-height:70px;
  padding:12px 20px;
  display:flex;
  align-items:center;
  gap:22px;
}

.logo{
  font-size:27px;
  font-weight:900;
  white-space:nowrap;
  cursor:pointer;
}

.logo span{
  color:var(--accent);
}

.nav-links{
  display:flex;
  gap:5px;
  flex:1;
  overflow:auto;
}

.nav-links button{
  background:none;
  color:var(--muted);
  border:0;
  padding:10px 11px;
  border-radius:8px;
  white-space:nowrap;
}

.nav-links button:hover,
.nav-links button.active{
  color:#fff;
  background:var(--card2);
}

.header-search{
  width:210px;
}

.header-search input{
  width:100%;
  padding:10px 13px;
  border:1px solid var(--border);
  background:var(--card);
  color:white;
  border-radius:9px;
  outline:none;
}

.menu-btn{
  display:none;
  background:var(--card);
  color:#fff;
  border:1px solid var(--border);
  padding:8px 11px;
  border-radius:8px;
}

/* =========================
   APP
========================= */

main{
  max-width:1400px;
  margin:auto;
  padding:25px 20px 70px;
}

.page{
  animation:pageIn .25s ease;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.hero{
  min-height:440px;
  border-radius:20px;
  padding:55px;
  display:flex;
  align-items:center;
  background:
    linear-gradient(90deg,#090a0f 15%,rgba(9,10,15,.78),rgba(9,10,15,.2)),
    linear-gradient(135deg,#252039,#11131b);
  margin-bottom:35px;
}

.hero-content{
  max-width:650px;
}

.badge{
  display:inline-block;
  background:var(--accent);
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  margin-bottom:15px;
}

.hero h1{
  font-size:clamp(35px,6vw,68px);
  line-height:1;
  margin-bottom:18px;
}

.hero p{
  color:#b8bbc7;
  line-height:1.7;
  margin-bottom:22px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  padding:11px 17px;
  border-radius:9px;
  background:var(--accent);
  color:#fff;
  font-weight:bold;
}

.btn:hover{
  background:var(--accent2);
}

.btn.secondary{
  background:var(--card2);
  border:1px solid var(--border);
}

.btn.danger{
  background:var(--danger);
}

/* =========================
   SECTIONS
========================= */

.section{
  margin:35px 0;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.section-head h2{
  font-size:22px;
}

.section-head button{
  border:0;
  background:none;
  color:var(--accent2);
}

.grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:16px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  transition:.2s;
  min-width:0;
}

.card:hover{
  transform:translateY(-4px);
  border-color:#3a3e50;
}

.poster{
  aspect-ratio:2/3;
  background:
    linear-gradient(135deg,#282038,#12141c);
  display:flex;
  align-items:flex-end;
  padding:12px;
  position:relative;
}

.poster-number{
  font-size:48px;
  font-weight:900;
  opacity:.13;
}

.card-info{
  padding:12px;
}

.card-title{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card-meta{
  color:var(--muted);
  font-size:12px;
  margin-top:7px;
}

.card-buttons{
  display:flex;
  gap:5px;
  margin-top:10px;
}

.small-btn{
  flex:1;
  border:1px solid var(--border);
  background:var(--card2);
  color:white;
  padding:7px;
  border-radius:7px;
  font-size:11px;
}

/* =========================
   DETAILS
========================= */

.detail{
  display:grid;
  grid-template-columns:230px 1fr;
  gap:30px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:25px;
}

.detail-poster{
  aspect-ratio:2/3;
  border-radius:10px;
  background:linear-gradient(135deg,#30254e,#11131b);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:70px;
  font-weight:900;
  opacity:.8;
}

.detail h1{
  font-size:38px;
  margin-bottom:12px;
}

.detail p{
  color:#afb2bf;
  line-height:1.7;
  margin:15px 0;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:12px 0;
}

.tag{
  border:1px solid var(--border);
  padding:6px 9px;
  border-radius:20px;
  font-size:12px;
  color:#c5c7d0;
}

/* =========================
   PLAYER
========================= */

.player{
  background:#000;
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--border);
}

.video{
  aspect-ratio:16/9;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at center,#28213c,#050507 65%);
  position:relative;
}

.play-circle{
  width:75px;
  height:75px;
  border-radius:50%;
  background:rgba(124,92,255,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  cursor:pointer;
}

.video-label{
  position:absolute;
  bottom:15px;
  left:15px;
  color:#aaa;
  font-size:12px;
}

.controls{
  padding:10px;
  display:flex;
  gap:8px;
  align-items:center;
}

.progress{
  flex:1;
  height:5px;
  background:#272832;
  border-radius:5px;
  overflow:hidden;
  cursor:pointer;
}

.progress-bar{
  width:0%;
  height:100%;
  background:var(--accent);
}

/* =========================
   EPISODES
========================= */

.episodes{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:8px;
}

.ep{
  padding:10px;
  border:1px solid var(--border);
  background:var(--card);
  color:#bbb;
  border-radius:7px;
}

.ep:hover,
.ep.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

/* =========================
   SEARCH
========================= */

.search-box{
  display:flex;
  gap:10px;
  margin-bottom:25px;
}

.search-box input,
.form-input{
  flex:1;
  background:var(--card);
  border:1px solid var(--border);
  color:#fff;
  padding:13px;
  border-radius:9px;
  outline:none;
}

/* =========================
   INFO / SETTINGS
========================= */

.info-box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:25px;
  line-height:1.8;
}

.setting{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:17px 0;
  border-bottom:1px solid var(--border);
}

.setting:last-child{
  border:0;
}

select{
  background:var(--card2);
  color:white;
  border:1px solid var(--border);
  padding:8px;
  border-radius:7px;
}

/* =========================
   TOAST
========================= */

#toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:500;
  background:#191b25;
  border:1px solid var(--border);
  color:white;
  padding:13px 17px;
  border-radius:9px;
  transform:translateY(100px);
  opacity:0;
  transition:.3s;
}

#toast.show{
  transform:none;
  opacity:1;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }

  .nav-links{
    display:none;
  }

  .menu-btn{
    display:block;
  }

  .header-search{
    margin-left:auto;
  }
}

@media(max-width:700px){
  main{
    padding:15px 12px 50px;
  }

  .navbar{
    padding:10px 12px;
    gap:10px;
  }

  .logo{
    font-size:22px;
  }

  .header-search{
    width:135px;
  }

  .hero{
    min-height:350px;
    padding:25px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .detail{
    grid-template-columns:110px 1fr;
    padding:15px;
    gap:15px;
  }

  .detail h1{
    font-size:23px;
  }

  .episodes{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<!-- LOADING SCREEN -->
<div id="loader">
  <div class="loader-box">
    <div class="loader-logo">7<span>Anime</span></div>
    <div class="loader-line big shimmer"></div>
    <div class="loader-line shimmer"></div>
    <div class="loader-line shimmer"></div>
    <div class="loader-line shimmer"></div>
  </div>
</div>

<header>
  <div class="navbar">

    <div class="logo" onclick="navigate('home')">
      7<span>Anime</span>
    </div>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>

    <nav class="nav-links" id="navLinks">
      <button data-page="home" onclick="navigate('home')">Home</button>
      <button data-page="search" onclick="navigate('search')">Search</button>
      <button data-page="explore" onclick="navigate('explore')">Explore</button>
      <button data-page="schedule" onclick="navigate('schedule')">Schedule</button>
      <button data-page="genres" onclick="navigate('genres')">Genres</button>
      <button data-page="movies" onclick="navigate('movies')">Movies</button>
      <button data-page="tv" onclick="navigate('tv')">TV Series</button>
      <button data-page="watchlist" onclick="navigate('watchlist')">Watchlist</button>
      <button data-page="history" onclick="navigate('history')">History</button>
      <button data-page="profile" onclick="navigate('profile')">Profile</button>
      <button data-page="settings" onclick="navigate('settings')">Settings</button>
    </nav>

    <div class="header-search">
      <input
        id="headerSearch"

        oninput="quickSearch(this.value)"
      >

</header>

<main id="app"></main>

<div id="toast"></div>

<script>

/* =====================================================

===================================================== */

];


/* =====================================================
   STORAGE
===================================================== */

let watchlist = JSON.parse(
  localStorage.getItem("7anime_watchlist") || "[]"
);

let favorites = JSON.parse(
  localStorage.getItem("7anime_favorites") || "[]"
);

let history = JSON.parse(
  localStorage.getItem("7anime_history") || "[]"
);

let progress = JSON.parse(
  localStorage.getItem("7anime_progress") || "{}"
);

let settings = JSON.parse(
  localStorage.getItem("7anime_settings") || "{}"
);

let currentAnime = null;
let currentEpisode = 1;
let playerProgress = 0;
let playerTimer = null;


/* =====================================================
   HELPERS
===================================================== */

function save(){
  localStorage.setItem(
    "7anime_watchlist",
    JSON.stringify(watchlist)
  );

  localStorage.setItem(
    "7anime_favorites",
    JSON.stringify(favorites)
  );

  localStorage.setItem(
    "7anime_history",
    JSON.stringify(history)
  );

  localStorage.setItem(
    "7anime_progress",
    JSON.stringify(progress)
  );

  localStorage.setItem(
    "7anime_settings",
    JSON.stringify(settings)
  );
}

function animeById(id){
  return animeData.find(a => a.id == id);
}

function toast(message){
  const el = document.getElementById("toast");

  el.textContent = message;
  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2200);
}

function card(anime){
  const saved = watchlist.includes(anime.id);
  const fav = favorites.includes(anime.id);

  return `
    <div class="card">

      <div
        class="poster"
        onclick="navigate('details',${anime.id})"
        style="cursor:pointer"
      >
        <div class="poster-number">
          ${anime.id}
        </div>
      </div>

      <div class="card-info">

        <div
          class="card-title"
          onclick="navigate('details',${anime.id})"
          style="cursor:pointer"
        >
          ${anime.title}
        </div>

        <div class="card-meta">
          ${anime.year} • ${anime.type} • ⭐ ${anime.rating}
        </div>

        <div class="card-buttons">

          <button
            class="small-btn"
            onclick="navigate('watch',${anime.id})"
          >
            ▶ Watch
          </button>

          <button
            class="small-btn"
            onclick="toggleWatchlist(${anime.id})"
          >
            ${saved ? "✓ Saved" : "+ List"}
          </button>

          <button
            class="small-btn"
            onclick="toggleFavorite(${anime.id})"
          >
            ${fav ? "♥" : "♡"}
          </button>

        </div>

      </div>

    </div>
  `;
}

function grid(items){
  if(!items.length){
    return `
      <div class="info-box">
        No anime found.
      </div>
    `;
  }

  return `
    <div class="grid">
      ${items.map(card).join("")}
    </div>
  `;
}


/* =====================================================
   NAVIGATION
===================================================== */

function navigate(page,id=null){

  stopPlayer();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  document.querySelectorAll(".nav-links button")
    .forEach(btn=>{
      btn.classList.toggle(
        "active",
        btn.dataset.page === page
      );
    });

  switch(page){

    case "home":
      renderHome();
      break;

    case "search":
      renderSearch();
      break;

    case "explore":
      renderExplore();
      break;

    case "details":
      renderDetails(id);
      break;

    case "watch":
      renderWatch(id);
      break;

    case "episodes":
      renderEpisodes(id);
      break;

    case "schedule":
      renderSchedule();
      break;

    case "genres":
      renderGenres();
      break;

    case "movies":
      renderCategory("Movie");
      break;

    case "tv":
      renderCategory("TV Series");
      break;

    case "profile":
      renderProfile();
      break;

    case "watchlist":
      renderWatchlist();
      break;

    case "history":
      renderHistory();
      break;

    case "favorites":
      renderFavorites();
      break;

    case "continue":
      renderContinue();
      break;

    case "settings":
      renderSettings();
      break;

    case "about":
      renderAbout();
      break;

    case "contact":
      renderContact();
      break;

    case "privacy":
      renderPrivacy();
      break;

    case "terms":
      renderTerms();
      break;

    case "404":
      render404();
      break;

    case "error":
      renderError();
      break;

    default:
      render404();
  }
}


/* =====================================================
   HOME
===================================================== */

function renderHome(){

  const featured = animeData[0];

  document.getElementById("app").innerHTML = `

    <section class="page">

        <div class="hero-content">

            >
              More Details
            </button>

          </div>

        </div>

      </div>


      <div class="section">

        <div class="section-head">

          <button onclick="navigate('continue')">

          </button>
        </div>

        ${renderContinueInline()}

      </div>


      <div class="section">

        <div class="section-head">
          <h2>Trending Anime</h2>

          <button onclick="navigate('explore')">
            Explore →
          </button>
        </div>

        ${g
